<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">TriTeam E-Commerce</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .banner { background-color: #e9ecef; padding: 2rem 0; text-align: center; }
    </style>
</head>
<body>
    <!-- Floating NavBar with Search Component -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" th:href="@{/home}">TriTeam E-Commerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/home}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/category(param='all')}">Categories</a></li>
                </ul>
                <!-- Search Form -->
                <form class="d-flex" th:action="@{/category}" method="get">
                    <input class="form-control me-2" type="search" placeholder="Search products..." aria-label="Search" name="keyword" th:value="${keyword}">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/checkout(param='view')}">Cart</a></li>

                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'STAFF')"><a class="nav-link text-warning" th:href="@{/staff/product/add}">+ Add Product</a></li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link text-info" th:href="@{/admin/users}">Manage Users</a></li>

                    <!-- Show Login if the user is not logged in -->
                    <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:href="@{/login}">Login</a></li>

                    <!-- Show Logout if the user is logged in -->
                    <li class="nav-item" sec:authorize="isAuthenticated()"><form th:action="@{/logout}" method="post" class="d-inline m-0"><button type="submit" class="nav-link bg-transparent border-0">Logout</button></form></li>

                </ul>
            </div>
        </div>
    </nav> 
    <!-- Bootstrap JavaScript -->
    <div th:fragment="footerScripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </div>
</body>
</html>
