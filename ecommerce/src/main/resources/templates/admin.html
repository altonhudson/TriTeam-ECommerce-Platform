<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Users - Admin')}"></head>
<body class="bg-light">

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>User Management Dashboard</h2>
            <a th:href="@{/admin/users/add}" class="btn btn-success">+ Add New User</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}">1</td>
                            <td th:text="${u.username}">username</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${u.role}">ROLE_USER</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn btn-sm btn-primary">Edit</a>
                                <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footerScripts}"></div>
</body>
</html>
