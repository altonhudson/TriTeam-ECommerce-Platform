<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Injecting head fragment -->
<head th:replace="~{fragments :: head('Add Product - TriTeam E-Commerce')}"></head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <div th:replace="~{fragments :: navbar}"></div>

    <!-- Form Container -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">Add New Product</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- The Form which is bound to the Product object which is passed by the controller -->
                        <form th:action="@{/admin/product/add}" th:object="${product}" method="post">
                            
                            <div class="row">
                                <!-- Product Name -->
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label fw-bold">Product Name</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" 
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                        Name error message here.
                                    </div>
                                </div>

                                <!-- SKU -->
                                <div class="col-md-6 mb-3">
                                    <label for="sku" class="form-label fw-bold">SKU (Stock Keeping Unit)</label>
                                    <input type="text" class="form-control" id="sku" th:field="*{sku}"
                                           th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}">
                                        SKU error message here.
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <!-- Unit Price -->
                                <div class="col-md-6 mb-3">
                                    <label for="unitPrice" class="form-label fw-bold">Unit Price ($)</label>
                                    <input type="number" step="0.01" class="form-control" id="unitPrice" th:field="*{unitPrice}"
                                           th:classappend="${#fields.hasErrors('unitPrice')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}">
                                        Price error message here.
                                    </div>
                                </div>

                                <!-- Category Dropdown -->
                                <div class="col-md-6 mb-4">
                                    <label for="category" class="form-label fw-bold">Category</label>
                                    <select class="form-select" id="category" th:field="*{category}"
                                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                                        <option value="">-- Select a Category --</option>
                                        <option value="computers">Computers</option>
                                        <option value="smartphones">Smartphones</option>
                                        <option value="audio">Audio</option>
                                        <option value="accessories">Accessories</option>
                                        <option value="networking">Networking</option>
                                        <option value="office">Office Supplies</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">
                                        Category error message here.
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Save Product to Database</button>
                                <a th:href="@{/category}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Injecting footer scripts -->
    <div th:replace="~{fragments :: footerScripts}"></div>
</body>
</html>
